<!DOCTYPE html>

<html lang="en">

<head>

	<meta charset="UTF-8">

	<meta name="description" content="Live and historical player counts for CrabbyMC and AshSMP.">

	<link rel="stylesheet" href="../css/main.css">

	<link rel="icon" type="image/svg+xml" href="../images/logo.svg">

	<script defer type="module" src="../js/main.js"></script>

	<title>Xiri Track</title>

</head>

<body>

	<div id="tooltip"></div>

	<div id="status-overlay">
		<img class="logo-image" src="../images/logo.svg" alt="">
		<h1 class="logo-text">Xiri Track</h1>
		<div id="status-text">Connecting...</div>
	</div>

	<div id="push">

		<div id="perc-bar"></div>

		<header>
			<div class="header-possible-row-break column-left">
				<img class="logo-image" src="../images/logo.svg" alt="">
				<h1 class="logo-text">Xiri Track</h1>
				<p class="logo-status">Tracking <span class="global-stat" id="stat_networks">0</span> Minecraft networks.</p>
			</div>

			<div class="header-possible-row-break column-right">
				<div id="total-players" class="header-stat"><span class="header-stat-label">Total Players</span><strong class="header-stat-value" id="stat_totalPlayers">0</strong></div>

				<div id="sort-by" class="header-button header-button-single" style="margin-left: 20px;"><span class="icon-sort-amount-desc"></span> Sort By<br><strong id="sort-by-text">...</strong></div>

				<div id="settings-toggle" class="header-button header-button-single" style="margin-left: 20px;"><span class="icon-gears"></span> Graph Controls</div>
			</div>
		</header>

		<div id="big-graph"></div>

		<div id="big-graph-controls">
			<div id="big-graph-controls-drawer">
				<div id="big-graph-checkboxes"></div>

				<span class="graph-controls-setall">
					<a minetrack-show-type="all" class="button graph-controls-show"><span class="icon-eye"></span> Show All</a>
					<a minetrack-show-type="none" class="button graph-controls-show"><span class="icon-eye-slash"></span> Hide All</a>
					<a minetrack-show-type="favorites" class="button graph-controls-show"><span class="icon-star"></span> Only Favorites</a>
				</span>
			</div>
		</div>

		<div id="server-list"></div>

	</div>

	<footer id="footer">
		<span class="icon-code"></span> Xiri Track is powered by <a href="https://github.com/Cryptkeeper/Minetrack">Minetrack</a>, open source software by Cryptkeeper (MIT) - <a href="https://github.com/XIRI-VENTURES-SRL/minetrack">source</a>
	</footer>

</body>

</html>
