# Xiri Track behind nginx running on the Docker host.
#
# Minetrack only listens on 127.0.0.1:8080 (see compose.yml).
# Install as /etc/nginx/conf.d/track.xiri.ventures.conf (or sites-available + symlink), then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: Cloudflare record proxied (orange cloud), SSL/TLS mode "Full (strict)", using a
# Cloudflare Origin CA certificate (SSL/TLS -> Origin Server -> Create Certificate).

# Send "Connection: upgrade" only for WebSocket requests
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name track.xiri.ventures;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name track.xiri.ventures;

    ssl_certificate     /etc/ssl/cloudflare/track.xiri.ventures.pem;
    ssl_certificate_key /etc/ssl/cloudflare/track.xiri.ventures.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' wss://track.xiri.ventures; frame-ancestors 'none'; base-uri 'self'; form-action 'none'; object-src 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade (live updates use the same URL as the page)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket connections stay open for as long as a visitor keeps the page open
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
